<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Quick Note Taker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        
        #app {
            display: flex;
            height: 100vh;
        }
        
        #sidebar {
            width: 280px;
            background-color: #1f2937;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        #sidebar h2 {
            margin-bottom: 20px;
        }
        
        #new-note {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        #notes-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .note-item {
            background-color: #374151;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            position: relative;
        }
        
        .note-item.active {
            background-color: #4b5563;
        }
        
        .note-title {
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .note-date {
            font-size: 12px;
            color: #d1d5db;
        }
        
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            color: #f87171;
            cursor: pointer;
        }
        
        #editor {
            flex: 1;
            padding: 20px;
            background-color: #f9fafb;
            display: flex;
            flex-direction: column;
        }
        
        #note-title {
            padding: 12px;
            font-size: 24px;
            border: none;
            outline: none;
            margin-bottom: 10px;
            background: transparent;
        }
        
        textarea {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            resize: none;
            outline: none;
            background-color: white;
            border-radius: 10px;
        }
        
        #toolbar {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        
        #toolbar button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        #save {
            background-color: #3b82f6;
            color: white;
        }
        
        #save-as {
            background-color: #8b5cf6;
            color: white;
        }
        
        #open-file {
            background-color: #f59e0b;
            color: white;
        }
        
        #increase-font,
        #decrease-font {
            background-color: #374151;
            color: white;
        }
        
        #status {
            margin-top: 10px;
            color: green;
        }
        
        #word-count {
            margin-top: 5px;
            color: #6b7280;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <div id="app">

        <div id="sidebar">

            <h2>📝 Notes</h2>

            <button id="new-note">
        + New Note
      </button>

            <div id="notes-list"></div>

        </div>

        <div id="editor">

            <input type="text" id="note-title" placeholder="Note Title">

            <textarea id="note"></textarea>

            <div id="toolbar">

                <button id="save">
          💾 Save
        </button>

                <button id="save-as">
          📁 Save As
        </button>

                <button id="open-file">
          📂 Open
        </button>

                <button id="increase-font">
          A+
        </button>

                <button id="decrease-font">
          A-
        </button>

            </div>

            <p id="status"></p>

            <p id="word-count">
                Words: 0 | Characters: 0
            </p>

        </div>

    </div>

    <script src="renderer.js"></script>

</body>

</html>
