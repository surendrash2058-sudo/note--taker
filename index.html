<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>📝Quick Note Taker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <aside id="sidebar">
            <h2>📝 Notes</h2>
            <button id="toggle-trash" style="margin-bottom: 10px; background: #6c7a89; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer;">🗑️ View Trash</button>
            <button id="new-note">➕ New Note</button>
            <div id="notes-list"></div>
            <button id="delete-all" class="danger">🗑️ Delete All</button>
        </aside>

        <div id="editor">
            <h1>📝 Quick Note Taker</h1>

            <input id="note-title" type="text" placeholder="Note title">

            <textarea id="note" placeholder="Write your note here..."></textarea>

            <div>
                <button id="save">💾 Save Note</button>
                <button id="save-as">📁 Save As</button>
                <button id="open-file">📂 Open File</button>
                <button id="new-note">➕ New Note</button>
                <button id="export-pdf">📄 Export PDF</button>
                <button id="print-note">🖨️ Print</button>
                <button id="delete-note" class="danger" style="margin-top: 0; width: auto; padding: 12px 18px;">🗑️ Delete Note</button>
            </div>

            <p id="save_status">Ready</p>
            <p id="word-count">Words: 0 | Characters: 0</p>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
<style>
    /* ... existing code ... */
    
    #word-count {
        font-size: 12px;
        color: #10ce59;
    }
    
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    
    body {
        margin: 0;
        font-family: system-ui;
        ;
        background: #f4f6f8;
        color: #222;
        height: 100vh;
    }
    
    #app {
        display: flex;
        height: 100vh;
    }
    /* Sidebar */
    
    #sidebar {
        width: 280px;
        background: #243447;
        color: white;
        display: flex;
        flex-direction: column;
        padding: 20px;
        gap: 8px;
        overflow-y: auto;
    }
    
    #sidebar h2 {
        margin-top: 0;
        margin-bottom: 20px;
    }
    
    #new-note {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: none;
        background: #2ecc71;
        color: white;
        font-size: 15px;
        cursor: pointer;
        border-radius: 6px;
    }
    
    #new-note:hover {
        background: #27ae60;
    }
    
    #notes-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
    }
    
    .note-item {
        background: #34495e;
        padding: 12px;
        border-radius: 6px;
        cursor: pointer;
        border-left: 4px solid transparent;
    }
    
    .note-item:hover {
        background: #3d566e;
    }
    
    .note-item.active {
        border-left: 4px solid #25636b;
        background: #405d78;
    }
    
    .note-title {
        font-weight: bold;
        margin-bottom: 5px;
        word-break: break-word;
    }
    
    .note-date {
        font-size: 12px;
        color: #cfd8dc;
        margin-bottom: 8px;
    }
    
    .delete-note {
        background: #e74c3c;
        border: none;
        color: white;
        padding: 5px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
    }
    
    .delete-note:hover {
        background: #c0392b;
    }
    
    .danger {
        width: 100%;
        margin-top: 20px;
        padding: 10px;
        border: none;
        background: #47221e;
        color: white;
        border-radius: 6px;
        cursor: pointer;
    }
    
    .danger:hover {
        background: #c0392b;
    }
    /* Editor */
    
    #editor {
        flex: 1;
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    #editor h1 {
        margin-top: 0;
    }
    
    #note-title {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        font-size: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
    }
    
    #note {
        flex: 1;
        width: 100%;
        padding: 15px;
        font-size: 16px;
        resize: none;
        border: 1px solid #ccc;
        border-radius: 6px;
        line-height: 1.5;
    }
    
    #buttons {
        margin-top: 15px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    
    #buttons button {
        padding: 12px 18px;
        border: none;
        background: #2c7a7b;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
    }
    
    #buttons button:hover {
        background: #225e5f;
    }
    
    #save_status {
        margin-top: 15px;
        color: #2c7a7b;
        font-weight: bold;
    }
    
    #file_path {
        color: #555;
        font-size: 13px;
        word-break: break-all;
    }
</style>
</body>


<script src="renderer.js"></script>

</html>
